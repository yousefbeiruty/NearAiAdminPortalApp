name: Update Screenshot Baselines

on:
  workflow_dispatch:

jobs:
  update-baselines:
    name: Generate and Commit Linux Baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate screenshot baselines (dev and production)
        run: ./gradlew :app:updateDevDebugScreenshotTest :app:updateProductionDebugScreenshotTest

      - name: Commit and push updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/screenshotTestDevDebug/reference/
          git add app/src/screenshotTestProductionDebug/reference/
          git diff --cached --quiet || git commit -m "chore: update screenshot baselines generated on Linux CI"
          git push || echo "No changes to push"
