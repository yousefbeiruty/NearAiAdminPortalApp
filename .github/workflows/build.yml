name: Build and Test

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'app/src/screenshotTestDevDebug/reference/**'
      - 'app/src/screenshotTestProductionDebug/reference/**'
  pull_request:
    branches: [main, develop]

jobs:
  gradle-wrapper-validation:
    name: Gradle Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Compile, Test, Lint
    runs-on: ubuntu-latest
    needs: gradle-wrapper-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug sources (dev and production)
        run: ./gradlew :app:compileDevDebugKotlin :app:compileProductionDebugKotlin

      - name: Run unit tests (dev and production)
        run: ./gradlew :app:testDevDebugUnitTest :app:testProductionDebugUnitTest

      - name: Validate screenshot baselines (dev and production)
        id: screenshot-validate
        continue-on-error: true
        run: ./gradlew :app:validateDevDebugScreenshotTest :app:validateProductionDebugScreenshotTest

      - name: Update screenshot baselines on failure (dev and production)
        if: github.event_name == 'push' && steps.screenshot-validate.outcome == 'failure'
        run: ./gradlew :app:updateDevDebugScreenshotTest :app:updateProductionDebugScreenshotTest

      - name: Commit updated baselines on failure
        if: github.event_name == 'push' && steps.screenshot-validate.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/screenshotTestDevDebug/reference/
          git add app/src/screenshotTestProductionDebug/reference/
          git diff --cached --quiet || git commit -m "chore: update screenshot baselines generated on Linux CI"
          git push || echo "No changes to push"

      - name: Re-validate screenshot baselines after update
        if: github.event_name == 'push' && steps.screenshot-validate.outcome == 'failure'
        run: ./gradlew :app:validateDevDebugScreenshotTest :app:validateProductionDebugScreenshotTest

      - name: Run lint (dev and production)
        run: ./gradlew :app:lintDevDebug :app:lintProductionDebug

      - name: Assemble debug APKs (dev and production)
        run: ./gradlew :app:assembleDevDebug :app:assembleProductionDebug

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint/

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/
