name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gradle-wrapper-validation:
    name: Gradle Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Compile, Test, Lint
    runs-on: ubuntu-latest
    needs: gradle-wrapper-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug sources (dev and production)
        run: ./gradlew :app:compileDevDebugKotlin :app:compileProductionDebugKotlin

      - name: Run unit tests (dev and production)
        run: ./gradlew :app:testDevDebugUnitTest :app:testProductionDebugUnitTest

      - name: Validate screenshot baselines (dev and production)
        run: ./gradlew :app:validateDevDebugScreenshotTest :app:validateProductionDebugScreenshotTest

      - name: Run lint (dev and production)
        run: ./gradlew :app:lintDevDebug :app:lintProductionDebug

      - name: Assemble debug APKs (dev and production)
        run: ./gradlew :app:assembleDevDebug :app:assembleProductionDebug

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint/

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/
